[project]
name = "chem-repro-suite"
version = "0.4.5"
description = "Shared chemistry tool pool and three paper adapters for CoScientist_dev"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp==2.14.7", "pydantic>=2.11,<3", "numpy>=2,<3", "pandas>=2.2,<3",
  "scipy>=1.13,<2", "scikit-learn==1.6.1", "rdkit==2026.3.3", "matplotlib>=3.9,<4",
  "httpx>=0.28,<1", "boto3>=1.34", "pillow>=11", "catboost==1.2.8",
  "reportlab>=4.4,<5", "svglib==1.5.1"
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "markdown-it-py>=4,<5"]

[project.scripts]
mannich-2026-mcp = "chem_repro.mannich.server:main"
heracleum-2026-mcp = "chem_repro.heracleum.server:main"
cannabis-2026-mcp = "chem_repro.cannabis.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chem_repro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
extend-exclude = ["chem_repro/vendor", "chem_repro/data"]
